name: Debug APK

# 手动触发：打 debug 包，使用仓库 Secrets 中的固定 keystore 签名，
# 保证不同构建之间签名一致，可直接覆盖安装。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 准备 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 还原固定签名
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/fixed.keystore"
            cat > keystore.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/fixed.keystore
          storePassword=Aigw2026Fix
          keyAlias=aigw
          keyPassword=Aigw2026Fix
          PROPS
          echo "使用固定签名"
          else
          echo "未配置 DEBUG_KEYSTORE_B64，回退 debug 签名"
          fi

      - name: 打包 debug（有 keystore.properties 时以其签名）
        run: gradle :app:assembleDebug --console=plain

      - name: 校验签名指纹
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          /usr/bin/keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m2 'SHA256\|Owner' || true

      - name: 重命名产物
        run: cp app/build/outputs/apk/debug/app-debug.apk ai-gateway-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-debug
          path: ai-gateway-debug.apk
          retention-days: 90
